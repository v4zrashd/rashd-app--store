# auto-resolve-logo-links
# imgbb পেজ লিংক (ibb.co.com/xxx) অটো Direct link (i.ibb.co/...) বানায়।
# apps.json / config.json-এ পেজ লিংক সেভ হলেই ১-২ মিনিটে ঠিক হয়ে যাবে।
name: Auto-resolve imgbb page links
on:
  push:
    branches: [main]
    paths: ['apps.json', 'config.json']
jobs:
  resolve:
    if: "!contains(github.event.head_commit.message, 'auto-resolve logos')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve page links to direct image links
        run: |
          python3 - <<'PYEOF'
          import json, re, urllib.request
          PAGE_RX = re.compile(r'https?://(?:www\.)?(?:ibb\.co\.com|imgbb\.com)/[A-Za-z0-9]+/?$')
          OG1 = re.compile(r'''property=["']og:image["'][^>]*content=["']([^"']+)["']''', re.I)
          OG2 = re.compile(r'''content=["']([^"']+)["'][^>]*property=["']og:image["']''', re.I)
          def resolve(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Linux; Android 14)'})
                  html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
                  m = OG1.search(html) or OG2.search(html)
                  return m.group(1) if m else None
              except Exception as e:
                  print('FAILED', url, e)
                  return None
          def fix(obj):
              n = 0
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == 'logo' and isinstance(v, str) and PAGE_RX.match(v.strip()):
                          d = resolve(v.strip())
                          if d:
                              obj[k] = d
                              n += 1
                              print('OK', v.strip(), '->', d[:70])
                      else:
                          n += fix(v)
              elif isinstance(obj, list):
                  for x in obj:
                      n += fix(x)
              return n
          total = 0
          for path in ('apps.json', 'config.json'):
              try:
                  with open(path, encoding='utf-8') as f:
                      data = json.load(f)
              except FileNotFoundError:
                  continue
              c = fix(data)
              if c:
                  with open(path, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2, ensure_ascii=False)
                      f.write('\n')
              total += c
          print('RESOLVED' if total else 'NO CHANGE', total)
          PYEOF
      - name: Commit resolved links
        run: |
          git config user.name "v4z-bot"
          git config user.email "v4z-bot@users.noreply.github.com"
          git add apps.json config.json
          git diff --cached --quiet || git commit -q -m "auto-resolve logos: imgbb page links -> direct links" && git push -q || true

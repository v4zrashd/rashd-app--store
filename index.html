<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>RASHD App Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712; --card:rgba(9,18,38,.92); --cyan:#00ffcc; --blue:#0099ff; --pink:#ff007f;
  --border:rgba(0,255,204,.28); --text:#f1f5f9; --muted:#94a3b8;
  --mono:'Share Tech Mono',monospace; --sans:'Plus Jakarta Sans','Noto Sans Bengali',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,255,204,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,204,.035) 1px,transparent 1px);
  background-size:26px 26px}
.glow{position:fixed;top:-110px;left:50%;transform:translateX(-50%);width:340px;height:340px;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(0,153,255,.22),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 12px 70px}
/* header */
header{text-align:center;margin-bottom:14px}
.logo-ring{width:76px;height:76px;border-radius:50%;padding:3px;margin:0 auto 8px;
  background:linear-gradient(135deg,var(--cyan),var(--blue),var(--pink));
  box-shadow:0 0 24px rgba(0,255,204,.45);animation:spinGlow 6s linear infinite}
@keyframes spinGlow{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#060e1e;display:block}
h1{font-family:var(--mono);font-size:22px;letter-spacing:2px;text-shadow:0 0 14px var(--cyan)}
.sub{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:1px;margin-top:4px}
/* stats */
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;backdrop-filter:blur(10px)}
.stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--cyan)}
.stat span{font-size:11px;color:var(--muted)}
/* search */
.search{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,255,204,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--muted);
  border-radius:20px;padding:7px 16px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
.chip.on{background:rgba(0,255,204,.15);color:var(--cyan);border-color:var(--cyan)}
/* section title */
.sec{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--cyan);margin:16px 2px 10px}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;
  backdrop-filter:blur(10px);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.card:active{transform:scale(.97)}
.card:hover{box-shadow:0 0 16px rgba(0,255,204,.2)}
.card img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#0a1428;margin-bottom:8px}
.card h3{font-size:13px;font-weight:700;line-height:1.35;word-break:break-word;min-height:35px}
.card .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-family:var(--mono);
  background:rgba(0,255,204,.12);color:var(--cyan);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
/* trending */
.trend{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.trend img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#0a1428}
.trend .rank{font-family:var(--mono);font-size:20px;color:var(--pink);text-shadow:0 0 10px var(--pink);min-width:28px;text-align:center}
.trend h3{font-size:13.5px}
.trend p{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:#071022;border:1px solid var(--border);
  border-bottom:none;border-radius:20px 20px 0 0;padding:20px 18px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#1e293b;margin:0 auto 16px}
.d-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.d-head img{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#0a1428;border:1px solid var(--border)}
.d-head h2{font-size:17px;line-height:1.4}
.d-head p{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:4px;word-break:break-all}
.d-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.d-cell{background:rgba(0,255,204,.06);border:1px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center}
.d-cell b{display:block;font-family:var(--mono);font-size:14px;color:var(--cyan)}
.d-cell span{font-size:10.5px;color:var(--muted)}
.d-desc{font-size:13.5px;line-height:1.7;color:#cbd5e1;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px;margin-bottom:16px}
.dl{display:block;text-align:center;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#02131a;
  font-weight:800;font-size:16px;border-radius:14px;padding:14px;text-decoration:none;margin-bottom:10px;
  box-shadow:0 4px 20px rgba(0,255,204,.35)}
.dl:active{transform:scale(.98)}
.vid{display:block;text-align:center;border:1px solid var(--border);color:var(--cyan);border-radius:14px;
  padding:12px;text-decoration:none;font-size:14px;margin-bottom:10px}
.close{background:none;border:1px solid #334155;color:var(--muted);border-radius:14px;padding:12px;width:100%;font-size:14px;cursor:pointer}
/* footer */
footer{text-align:center;margin-top:26px;font-size:12px;color:var(--muted)}
footer a{color:var(--cyan);text-decoration:none;font-family:var(--mono)}
.loading{text-align:center;color:var(--muted);padding:30px;font-family:var(--mono);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
</style>
</head>
<body>
<div class="bg-grid"></div><div class="glow"></div>
<div class="wrap">
  <header>
    <div class="logo-ring"><img src="icons/logo.png" alt="RASHD" onerror="this.style.display='none'"></div>
    <h1>RASHD APP STORE</h1>
    <div class="sub">V4Z RASHD • CYBER APP COLLECTION</div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stApps">–</b><span>মোট অ্যাপ</span></div>
    <div class="stat"><b id="stDls">–</b><span>মোট ডাউনলোড</span></div>
  </div>

  <input class="search" id="q" placeholder="🔍 অ্যাপ খুঁজুন..." oninput="render()">

  <div class="chips" id="chips">
    <button class="chip on" data-c="ALL" onclick="setCat('ALL',this)">সব</button>
    <button class="chip" data-c="APK" onclick="setCat('APK',this)">APK</button>
    <button class="chip" data-c="APKS" onclick="setCat('APKS',this)">APKS</button>
    <button class="chip" data-c="ZIP" onclick="setCat('ZIP',this)">ZIP</button>
    <button class="chip" data-c="OTHER" onclick="setCat('OTHER',this)">অন্যান্য</button>
  </div>

  <div id="trendSec" style="display:none">
    <div class="sec">🔥 TOP TRENDING</div>
    <div id="trend"></div>
  </div>

  <div class="sec">📱 ALL APPS</div>
  <div class="grid" id="grid"><div class="loading">লোড হচ্ছে...</div></div>

  <footer>
    <a href="https://t.me/rashdteem">📢 t.me/rashdteem</a><br><br>
    © 2026 V4Z RASHD
  </footer>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="grab"></div>
    <div class="d-head">
      <img id="dIcon" src="" alt="">
      <div><h2 id="dName"></h2><p id="dPkg"></p></div>
    </div>
    <div class="d-grid">
      <div class="d-cell"><b id="dSize"></b><span>সাইজ</span></div>
      <div class="d-cell"><b id="dDls"></b><span>ডাউনলোড</span></div>
      <div class="d-cell"><b id="dFmt"></b><span>ফরম্যাট</span></div>
    </div>
    <div class="d-desc" id="dDesc"></div>
    <a class="vid" id="dVid" href="#" target="_blank" style="display:none">▶️ ভিডিও টিউটোরিয়াল</a>
    <a class="dl" id="dDl" href="#" target="_blank" rel="noopener">⬇️ ডাউনলোড</a>
    <button class="close" onclick="closeModal()">বন্ধ করুন</button>
  </div>
</div>

<script>
"use strict";
var REPO = "v4zrashd/rashd-app--store";
var apps = [];           // merged list
var cat = "ALL";
var BLOCKED = [/bomber/i];   // attack tools never listed

function fmtSize(b){ b=Number(b)||0; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function extOf(n){ var m=/\.([a-z0-9]+)$/i.exec(n||""); return m?m[1].toUpperCase():"FILE"; }
function cleanName(n){ return (n||"").replace(/\.[a-z0-9]+$/i,"").replace(/[._-]+/g," ").trim(); }
function catOf(n){ var e=extOf(n); return (e==="APK"||e==="APKS"||e==="ZIP")?e:"OTHER"; }
function iconFor(n){ return "icons/"+encodeURIComponent(n)+".png"; }

async function get(url, fb){
  try{ var r=await fetch(url); if(r.ok) return await r.json(); }catch(e){}
  return fb;
}

async function boot(){
  var aj = await get("assets.json", null);
  var cfg = await get("apps.json", null);
  var list = (aj && aj.assets) ? aj.assets.slice() : [];

  // live download counts from GitHub release
  get("https://api.github.com/repos/"+REPO+"/releases/tags/v1.0", null).then(function(rel){
    if(rel && rel.assets){
      var map={}; rel.assets.forEach(function(a){ map[a.name]=a; });
      var ch=false;
      apps.forEach(function(a){ var r=map[a.name];
        if(r){ var c=Number(r.download_count||0); if(c!==Number(a.downloads||0)){a.downloads=c;ch=true;}
               if(!a.url) a.url=r.browser_download_url||a.url; } });
      if(ch) render();
    }
  });

  var descMap={};
  if(cfg && cfg.apps) for(var k in cfg.apps) descMap[k]=cfg.apps[k];

  list.forEach(function(a){
    if(BLOCKED.some(function(rx){ return rx.test(a.name); })) return;  // skip attack tools
    var d = descMap[a.name] || {};
    apps.push({ name:a.name, size:a.size, downloads:Number(a.downloads||0),
                url:a.url||"", desc:d.desc||"ফাইলটি টেস্টেড ও নিরাপদ। ✅",
                video:d.video||"" });
  });
  apps.sort(function(a,b){ return b.downloads-a.downloads; });
  render();
}

function setCat(c, el){
  cat=c;
  var cs=document.getElementById("chips").children;
  for(var i=0;i<cs.length;i++) cs[i].classList.remove("on");
  el.classList.add("on");
  render();
}

function filtered(){
  var q=(document.getElementById("q").value||"").toLowerCase();
  return apps.filter(function(a){
    if(cat!=="ALL" && catOf(a.name)!==cat) return false;
    if(q && (a.name+" "+a.desc).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}

function cardHTML(a){
  return '<div class="card" onclick=\'openApp('+JSON.stringify(a.name)+')\'>'+
    '<span class="badge">'+extOf(a.name)+'</span>'+
    '<img loading="lazy" src="'+iconFor(a.name)+'" onerror="this.src=\'icons/logo.png\'" alt="">'+
    '<h3>'+cleanName(a.name)+'</h3>'+
    '<div class="meta"><span>⬇ '+Number(a.downloads).toLocaleString()+'</span><span>'+fmtSize(a.size)+'</span></div>'+
    '</div>';
}

function render(){
  var f=filtered();
  var g=document.getElementById("grid");
  g.innerHTML = f.length ? f.map(cardHTML).join("") : '<div class="empty">কিছু পাওয়া যায়নি 😕</div>';

  // trending (top 3, only when no search/filter)
  var ts=document.getElementById("trendSec");
  if(cat==="ALL" && !(document.getElementById("q").value||"").trim() && apps.length){
    ts.style.display="block";
    document.getElementById("trend").innerHTML = apps.slice(0,3).map(function(a,i){
      return '<div class="trend" onclick=\'openApp('+JSON.stringify(a.name)+')\'>'+
        '<div class="rank">'+(i+1)+'</div>'+
        '<img loading="lazy" src="'+iconFor(a.name)+'" onerror="this.src=\'icons/logo.png\'" alt="">'+
        '<div><h3>'+cleanName(a.name)+'</h3><p>⬇ '+Number(a.downloads).toLocaleString()+' • '+fmtSize(a.size)+'</p></div></div>';
    }).join("");
  } else ts.style.display="none";

  document.getElementById("stApps").textContent = apps.length;
  var tot=apps.reduce(function(s,a){return s+Number(a.downloads||0);},0);
  document.getElementById("stDls").textContent = tot.toLocaleString();
}

function openApp(name){
  var a=null; apps.forEach(function(x){ if(x.name===name) a=x; });
  if(!a) return;
  document.getElementById("dIcon").src=iconFor(a.name);
  document.getElementById("dIcon").onerror=function(){ this.src="icons/logo.png"; };
  document.getElementById("dName").textContent=cleanName(a.name);
  document.getElementById("dPkg").textContent=a.name;
  document.getElementById("dSize").textContent=fmtSize(a.size);
  document.getElementById("dDls").textContent=Number(a.downloads).toLocaleString();
  document.getElementById("dFmt").textContent=extOf(a.name);
  document.getElementById("dDesc").textContent=a.desc;
  var v=document.getElementById("dVid");
  if(a.video){ v.style.display="block"; v.href=a.video; } else v.style.display="none";
  var dl=document.getElementById("dDl");
  if(a.url){ dl.style.display="block"; dl.href=a.url; }
  else { dl.style.display="none"; alert("ডাউনলোড লিংক পাওয়া যায়নি।"); return; }
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow="";
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

boot();
</script>
</body>
</html>
